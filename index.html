<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>RP Scoring 計算工具 2.0</h1>
    <p>此版本為 RP Scoring 的 Web 版本，提供搖擺舞比賽的相對排名計算功能。<br>
    目前測試下來應該沒有太大的問題，如果有人發現 bug 歡迎跟我說</p>
    <i>
      <a href="https://www.rp-scoring.com/what-is-relative-placement" target="_blank" rel="noopener noreferrer">
        What is relative placement | Relative Placement</a><br>
      <a href="https://stepswing.com/post/rp-scoring/" target="_blank" rel="noopener noreferrer">
        看不懂搖擺舞比賽結果嗎？跟你介紹 RP-Scoring</a>
    </i>
    <div class="mode-switch">
      <label>
        <input type="radio" name="mode" value="prelim" checked>
        Prelim
      </label>
      <label>
        <input type="radio" name="mode" value="final">
        Final
      </label>
    </div>
    <form id="rp-form"></form>
    <div id="result"></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
